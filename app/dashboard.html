<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Devin Automation — Observability Dashboard</title>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Inter:wght@400;500;600&display=swap");

      :root {
        --bg: #0d1117;
        --surface: #161b22;
        --border: #30363d;
        --text: #e6edf3;
        --muted: #7d8590;
        --accent: #58a6ff;
        --green: #3fb950;
        --red: #f85149;
        --yellow: #d29922;
        --purple: #bc8cff;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        background: var(--bg);
        color: var(--text);
        font-family: "Inter", sans-serif;
        min-height: 100vh;
        padding: 32px;
      }

      header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 32px;
        padding-bottom: 20px;
        border-bottom: 1px solid var(--border);
      }

      .logo {
        display: flex;
        align-items: center;
        gap: 12px;
      }

      .logo-icon {
        width: 36px;
        height: 36px;
        background: var(--accent);
        border-radius: 8px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 18px;
      }

      h1 {
        font-size: 20px;
        font-weight: 600;
      }
      .subtitle {
        font-size: 13px;
        color: var(--muted);
        margin-top: 2px;
      }

      .live-badge {
        display: flex;
        align-items: center;
        gap: 6px;
        font-size: 12px;
        color: var(--green);
        font-family: "JetBrains Mono", monospace;
      }

      .live-dot {
        width: 8px;
        height: 8px;
        background: var(--green);
        border-radius: 50%;
        animation: pulse 2s infinite;
      }

      @keyframes pulse {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0.3;
        }
      }

      /* Stats Cards */
      .stats-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
        gap: 16px;
        margin-bottom: 32px;
      }

      .stat-card {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 20px;
      }

      .stat-label {
        font-size: 12px;
        color: var(--muted);
        text-transform: uppercase;
        letter-spacing: 0.05em;
        margin-bottom: 8px;
      }

      .stat-value {
        font-size: 32px;
        font-weight: 600;
        font-family: "JetBrains Mono", monospace;
        line-height: 1;
      }

      .stat-value.green {
        color: var(--green);
      }
      .stat-value.red {
        color: var(--red);
      }
      .stat-value.yellow {
        color: var(--yellow);
      }
      .stat-value.blue {
        color: var(--accent);
      }
      .stat-value.purple {
        color: var(--purple);
      }

      /* Tasks Table */
      .table-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 16px;
      }

      .table-title {
        font-size: 16px;
        font-weight: 600;
      }

      .refresh-time {
        font-size: 12px;
        color: var(--muted);
        font-family: "JetBrains Mono", monospace;
      }

      table {
        width: 100%;
        border-collapse: collapse;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 10px;
        overflow: hidden;
      }

      th {
        text-align: left;
        padding: 12px 16px;
        font-size: 12px;
        font-weight: 600;
        color: var(--muted);
        text-transform: uppercase;
        letter-spacing: 0.05em;
        border-bottom: 1px solid var(--border);
        background: var(--bg);
      }

      td {
        padding: 14px 16px;
        font-size: 13px;
        border-bottom: 1px solid var(--border);
        vertical-align: middle;
      }

      tr:last-child td {
        border-bottom: none;
      }
      tr:hover td {
        background: rgba(255, 255, 255, 0.02);
      }

      .badge {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        padding: 3px 10px;
        border-radius: 20px;
        font-size: 11px;
        font-weight: 600;
        font-family: "JetBrains Mono", monospace;
        text-transform: uppercase;
        letter-spacing: 0.03em;
      }

      .badge.completed {
        background: rgba(63, 185, 80, 0.15);
        color: var(--green);
      }
      .badge.running {
        background: rgba(88, 166, 255, 0.15);
        color: var(--accent);
      }
      .badge.pending {
        background: rgba(210, 153, 34, 0.15);
        color: var(--yellow);
      }
      .badge.failed {
        background: rgba(248, 81, 73, 0.15);
        color: var(--red);
      }

      .issue-title {
        font-weight: 500;
        max-width: 280px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .issue-num {
        color: var(--accent);
        font-family: "JetBrains Mono", monospace;
        font-size: 12px;
      }

      a {
        color: var(--accent);
        text-decoration: none;
      }
      a:hover {
        text-decoration: underline;
      }

      .mono {
        font-family: "JetBrains Mono", monospace;
        font-size: 11px;
        color: var(--muted);
      }

      .empty-state {
        text-align: center;
        padding: 60px 20px;
        color: var(--muted);
      }

      .empty-state .icon {
        font-size: 40px;
        margin-bottom: 12px;
      }
      .empty-state p {
        font-size: 14px;
      }
    </style>
  </head>
  <body>
    <header>
      <div class="logo">
        <div class="logo-icon">🤖</div>
        <div>
          <h1>Devin Automation</h1>
          <div class="subtitle">
            Automated Issue Remediation · Powered by Devin
          </div>
        </div>
      </div>
      <div class="live-badge">
        <div class="live-dot"></div>
        LIVE
      </div>
    </header>

    <!-- Stats Cards -->
    <div class="stats-grid">
      <div class="stat-card">
        <div class="stat-label">Total Tasks</div>
        <div class="stat-value blue" id="stat-total">—</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Completed</div>
        <div class="stat-value green" id="stat-completed">—</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Running</div>
        <div class="stat-value yellow" id="stat-running">—</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Failed</div>
        <div class="stat-value red" id="stat-failed">—</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Success Rate</div>
        <div class="stat-value purple" id="stat-success-rate">—</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Avg Time to PR</div>
        <div class="stat-value blue" id="stat-avg-time">—</div>
      </div>
    </div>

    <!-- Tasks Table -->
    <div class="table-header">
      <div class="table-title">All Tasks</div>
      <div class="refresh-time" id="last-updated">Refreshing...</div>
    </div>

    <table>
      <thead>
        <tr>
          <th>Issue</th>
          <th>Status</th>
          <th>Session</th>
          <th>Pull Request</th>
          <th>Started</th>
          <th>Duration</th>
        </tr>
      </thead>
      <tbody id="tasks-body">
        <tr>
          <td colspan="6">
            <div class="empty-state">
              <div class="icon">⏳</div>
              <p>Waiting for tasks...</p>
            </div>
          </td>
        </tr>
      </tbody>
    </table>

    <script>
      // Poll the API every 10 seconds and re-render the table
      async function fetchStats() {
        const res = await fetch("/api/stats");
        const s = await res.json();
        document.getElementById("stat-total").textContent = s.total ?? "0";
        document.getElementById("stat-completed").textContent =
          s.completed ?? "0";
        document.getElementById("stat-running").textContent = s.running ?? "0";
        document.getElementById("stat-failed").textContent = s.failed ?? "0";
        document.getElementById("stat-success-rate").textContent =
          s.success_rate != null ? s.success_rate + "%" : "—";
        document.getElementById("stat-avg-time").textContent =
          s.avg_minutes_to_pr != null ? s.avg_minutes_to_pr + "m" : "—";
      }

      async function fetchTasks() {
        const res = await fetch("/api/tasks");
        const tasks = await res.json();
        const tbody = document.getElementById("tasks-body");

        if (!tasks.length) {
          tbody.innerHTML = `<tr><td colspan="6">
        <div class="empty-state">
          <div class="icon">🤖</div>
          <p>No tasks yet. Label a GitHub issue with <strong>devin-task</strong> to get started.</p>
        </div></td></tr>`;
          return;
        }

        tbody.innerHTML = tasks
          .map((t) => {
            const statusBadge =
              {
                completed: "✅ Completed",
                running: "🔄 Running",
                pending: "⏳ Pending",
                failed: "❌ Failed",
              }[t.status] || t.status;

            const duration =
              t.started_at && t.finished_at
                ? Math.round(
                    (new Date(t.finished_at) - new Date(t.started_at)) / 60000,
                  ) + "m"
                : t.started_at
                  ? "In progress..."
                  : "—";

            const sessionLink = t.session_url
              ? `<a href="${t.session_url}" target="_blank" class="mono">${t.session_id?.slice(0, 12)}...</a>`
              : '<span class="mono">—</span>';

            const prLink = t.pr_url
              ? `<a href="${t.pr_url}" target="_blank">View PR →</a>`
              : '<span class="mono">—</span>';

            return `<tr>
        <td>
          <a href="${t.issue_url}" target="_blank" class="issue-num">#${t.issue_number}</a>
          <div class="issue-title">${t.issue_title}</div>
        </td>
        <td><span class="badge ${t.status}">${statusBadge}</span></td>
        <td>${sessionLink}</td>
        <td>${prLink}</td>
        <td class="mono">${t.started_at ? t.started_at.slice(0, 16) : "—"}</td>
        <td class="mono">${duration}</td>
      </tr>`;
          })
          .join("");
      }

      async function refresh() {
        await Promise.all([fetchStats(), fetchTasks()]);
        document.getElementById("last-updated").textContent =
          "Last updated: " + new Date().toLocaleTimeString();
      }

      // Initial load + poll every 10 seconds
      refresh();
      setInterval(refresh, 10000);
    </script>
  </body>
</html>
